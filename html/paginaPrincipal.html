<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin DoctorSV</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilosPrincipales.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand fw-extrabold fs-3 d-flex align-items-center gap-2" href="#" id="navInicio">
                <span class="brand-icono">Sin DoctorSV</span> 
            </a>
        </div>
    </nav>

    <main class="container my-5">
        <div id="vistaLanding" class="vista-seccion text-center">
            <h1 class="display-4 fw-bold mb-4">Sistema de Emergencias Medicas</h1>
            <p class="lead mb-5">Gestión y evaluación de pacientes.</p>
            <div class="d-grid gap-3 d-sm-flex justify-content-sm-center">
                <button class="btn btn-primary btn-lg px-4" id="btnIniciarEvaluacion">Iniciar Evaluación</button>
                <button class="btn btn-outline-secondary btn-lg px-4" id="btnVerPacientes">Ver Sala de Espera</button>
            </div>
        </div>

        <div id="vistaFormularioPersonales" class="vista-seccion d-none">
            <div class="card shadow border-0">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Paso 1: Datos Personales</h4>
                </div>
                <div class="card-body p-4">
                    <form id="formularioPersonales">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="inputNombre" class="form-label">Nombre Completo</label>
                                <input type="text" class="form-control" id="inputNombre">
                                <div class="invalid-feedback" id="errorNombre"></div>
                            </div>
                            <div class="col-md-6">
                                <label for="selectGenero" class="form-label">Género</label>
                                <select class="form-select" id="selectGenero">
                                    <option value="">Seleccione...</option>
                                    <option value="M">Masculino</option>
                                    <option value="F">Femenino</option>
                                </select>
                                <div class="invalid-feedback" id="errorGenero"></div>
                            </div>
                            <div class="col-md-3">
                                <label for="inputEdad" class="form-label">Edad</label>
                                <input type="number" class="form-control" id="inputEdad">
                                <div class="invalid-feedback" id="errorEdad"></div>
                            </div>
                            <div class="col-md-3">
                                <label for="inputTemperatura" class="form-label">Temperatura (°C)</label>
                                <input type="number" step="0.1" class="form-control" id="inputTemperatura">
                                <div class="invalid-feedback" id="errorTemperatura"></div>
                            </div>
                            <div class="col-md-3">
                                <label for="inputFrecuencia" class="form-label">Frecuencia Cardíaca</label>
                                <input type="number" class="form-control" id="inputFrecuencia">
                                <div class="invalid-feedback" id="errorFrecuencia"></div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Presión (Sis / Dia)</label>
                                <div class="input-group has-validation">
                                    <input type="number" class="form-control" id="inputSistolica" placeholder="120">
                                    <span class="input-group-text">/</span>
                                    <input type="number" class="form-control" id="inputDiastolica" placeholder="80">
                                    <div class="invalid-feedback" id="errorPresion"></div>
                                </div>
                            </div>
                        </div>
                        <div class="d-flex justify-content-between mt-4 border-top pt-3">
                            <button type="button" class="btn btn-secondary px-4" id="btnSalirFormulario">Salir</button>
                            <button type="button" class="btn btn-primary px-4" id="btnSiguientePaso">Siguiente</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div id="vistaFormularioSintomas" class="vista-seccion d-none">
            <div class="card shadow border-0">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Paso 2: Registro de Síntomas</h4>
                </div>
                <div class="card-body p-4">
                    <label class="form-label fw-bold">Escribe el síntoma:</label>
                    <div class="position-relative mb-4">
                        <input type="text" class="form-control form-control-lg" id="inputBuscarSintoma" placeholder="Ej. Dolor de Cabeza" autocomplete="off">
                        <div id="contenedorSugerencias" class="list-group position-absolute w-100 shadow d-none" style="z-index: 1000;"></div>
                    </div>

                    <h5 class="mb-3 text-secondary border-bottom pb-2">Síntomas Confirmados</h5>
                    <div class="row g-3 mb-4" id="contenedorSintomasSeleccionados">
                    </div>
                    
                    <div class="d-flex justify-content-between mt-4 border-top pt-3">
                        <button type="button" class="btn btn-secondary px-4" id="btnAnteriorPaso">Anterior</button>
                        <button type="button" class="btn btn-success px-4" id="btnEvaluarGuardar">Evaluar y Terminar</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="vistaDashboard" class="vista-seccion d-none">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="mb-0">Pacientes en Espera</h2>
                <button class="btn btn-outline-primary" id="btnVolverInicio">Regresar</button>
            </div>
            <div class="table-responsive bg-white rounded shadow-sm">
                <table class="table table-hover align-middle mb-0 tabla-minimalista">
                    <thead class="table-dark">
                        <tr>
                            <th>Paciente</th>
                            <th>Edad</th>
                            <th>Nivel de Prioridad</th>
                            <th>Alertas Críticas</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTablaPacientes">
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto w-100 position-fixed bottom-0">
        <p class="mb-0 small">Creditos van aqui</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/logica.js"></script>
    <script src="../js/efectosjQuery.js"></script>
</body>
</html>
