<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simulador de Emergencias Médicas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="css/estilosPrincipales.css">
</head>

<body class="fondoclinica">

    <header>
        <nav class="navbar navbar-expand-lg barranav fixed-top shadow-sm">
        <div class="container">
            <a class="navbar-brand textonav fw-bold" href="#">CLINICA WEB</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacionPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuNavegacionPrincipal">
                <ul class="navbar-nav secciones ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#registro">REGISTRO</a></li>
                    <li class="nav-item"><a class="nav-link" href="#lista">LISTA</a></li>
                </ul>
            </div>
        </div>
    </nav>
    </header>

    <main class="container contenedorregistro mt-5 pt-5">

        <section id="registro" class="mb-5">

            <h1 class="text-center mt-3 fw-bold">Simulador de Emergencias Médicas</h1>
            <br>
            <h2 class="text-center fw-bold">REGISTRAR  PACIENTES</h2>

            <form class="cajasregistro mt-4">

                <div class="campo-card mb-3">
                    <label for="nombre" class="form-label">NOMBRE</label>
                    <input type="text" id="nombre" class="form-control campo-medico"placeholder="Nombre del paciente">
                </div>

                <div class="campo-card mb-3">
                    <label for="edad" class="form-label">EDAD</label>
                    <input type="number" id="edad" class="form-control campo-medico"placeholder="Edad del paciente">
                </div>

                <div class="campo-card mb-3">
                    <label for="temperatura" class="form-label">TEMPERATURA</label>
                    <input type="number" step="0.1" id="temperatura"class="form-control campo-medico" placeholder="Temperatura del paciente en °C">
                </div>

                <div class="campo-card mb-3">
                    <label for="frecuencia" class="form-label">FRECUENCIA CARDÍACA</label>
                    <input type="number" id="frecuencia" class="form-control campo-medico" placeholder="Frecuencia cardíaca del paciente">
                </div>

                <div class="campo-card mb-3">
                    <label for="sintomas" class="form-label">SÍNTOMAS</label>
                    <textarea id="sintomas" class="form-control campo-medico" rows="3" placeholder="Escriba los síntomas del paciente"></textarea>
                </div>

                <div class="acciones-formulario">
                    <button type="button" class="btn btn-primary botonregistro" id="btnRegistrar">Registrar paciente</button>

                    <button type="reset" class="btn btn-secondary botonlimpiar">Limpiar</button>
                </div>

            </form>

        </section>


        <section id="lista" class="mb-5">

            <h2 class="text-center fw-bold">Pacientes Registrados</h2>

            <div class="table-responsive tabla-contenedor">
                <table class="table table-bordered tabla-pacientes align-middle text-center">

                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Edad</th>
                            <th>Prioridad</th>
                            <th>Temperatura</th>
                            <th>Frecuencia cardíaca</th>
                            <th>Estado</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td colspan="6" class="text-center">
                                No hay pacientes registrados.
                            </td>
                        </tr>
                    </tbody>

                </table>
            </div>


        </section>

    </main>


    
     <footer id="pie">
        <div id="contenedorcreditos">
            <p>... </p>
        </div>
        <div id="contenedorinformacionacademica">
            <p>Programación Web - 2026</p>
        </div>
    </footer>


</body>
</html>
